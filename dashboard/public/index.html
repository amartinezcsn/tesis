html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

.table :is(caption, thead th) {

}

}

}

  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;

  background: var(--accent);

.text-muted {

.sr-only {

.btn {

  min-height: 28px;
  align-items: center;

.btn:not(:disabled):hover {

  cursor: not-allowed;

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

}

.form-switch .form-check-input:disabled,

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

            &lt;div class=&quot;cc-meta-row&quot;&gt;&lt;span&gt;Cobertura efectiva&lt;/span&gt;&lt;strong id=&quot;cc-coverage&quot;&gt;&lt;/strong&gt;&lt;/div&gt;
            &lt;div class=&quot;cc-meta-row&quot;&gt;&lt;span&gt;Datos excluidos&lt;/span&gt;&lt;strong id=&quot;cc-excluded&quot;&gt;&lt;/strong&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cc-summary&quot;&gt;&lt;strong&gt;Conclusión global:&lt;/strong&gt; H1 recibe apoyo en compras, pero no en ventas. La evidencia respalda una conclusión parcial, no una aceptación general.&lt;/div&gt;
        &lt;/aside&gt;
      &lt;/div&gt;

      &lt;section class=&quot;cc-data-strip&quot; aria-label=&quot;Calidad y estructura de los datos&quot;&gt;
        &lt;div class=&quot;cc-data-item&quot;&gt;&lt;strong&gt;1,612 días&lt;/strong&gt;&lt;span&gt;Dataset maestro, 2022-01-01 a 2026-05-31&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cc-data-item&quot;&gt;&lt;strong&gt;65 variables&lt;/strong&gt;&lt;span&gt;Calendario, ventas, compras, clima e INPC&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cc-data-item&quot;&gt;&lt;strong&gt;1,584 × 276&lt;/strong&gt;&lt;span&gt;Dataset modelado tras rezagos de 28 días&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cc-data-item&quot;&gt;&lt;strong&gt;0 nulos&lt;/strong&gt;&lt;span&gt;Sin fechas faltantes en el maestro final&lt;/span&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;cupcake-research-dashboard&#x27;);
      const objectiveSelect = root.querySelector(&#x27;#cc-objective&#x27;);
      const baselineSelect = root.querySelector(&#x27;#cc-baseline&#x27;);
      const svg = root.querySelector(&#x27;#cc-chart&#x27;);
      const data = {
        salesAmount: {
          model: &#x27;ARIMA (1,1,2)&#x27;, dataset: &#x27;Dataset completo&#x27;, rmse: 161.1493, mae: 101.9506, mape: 1147.71,
          unit: &#x27;MXN reales de mayo de 2026&#x27;, coverage: &#x27;2022-01-29 — 2026-05-31&#x27;, excluded: &#x27;0 días&#x27;,
          periods: [&#x27;03 mar–01 abr&#x27;, &#x27;02 abr–01 may&#x27;, &#x27;02–31 may&#x27;], modelWindows: [142.1803, 168.6220, 172.6457],
          avg7: { rmse: 166.5625, windows: [141.6717, 181.9703, 176.0454] },
          last: { rmse: 165.8187, windows: [139.3698, 181.9703, 176.1159] },
          insight: &#x27;ARIMA mejora ligeramente la línea base, pero la reducción no alcanza el umbral de 20% planteado en H1 para ingresos por ventas.&#x27;,
          note: &#x27;El MAPE no debe ser la métrica principal aquí: los días con ventas cercanas a cero lo inflan de forma extrema. La conclusión se apoya en RMSE y MAE.&#x27;
        },
        salesRecords: {
          model: &#x27;ARIMA (1,1,1)&#x27;, dataset: &#x27;Dataset completo&#x27;, rmse: 0.5251, mae: 0.3625, mape: 82.29,
          unit: &#x27;registros de venta por día&#x27;, coverage: &#x27;2022-01-29 — 2026-05-31&#x27;, excluded: &#x27;0 días&#x27;,
          periods: [&#x27;03 mar–01 abr&#x27;, &#x27;02 abr–01 may&#x27;, &#x27;02–31 may&#x27;], modelWindows: [0.5427, 0.5934, 0.4391],
          avg7: { rmse: 0.5533, windows: [0.5483, 0.6583, 0.4533] },
          last: { rmse: 0.5609, windows: [0.5774, 0.6583, 0.4472] },
          insight: &#x27;ARIMA ofrece una mejora consistente, aunque pequeña. Para la operación diaria conviene usarlo con una política de inventario de seguridad.&#x27;,
          note: &#x27;La demanda es intermitente; por eso MAPE permanece alto aun cuando RMSE y MAE muestran errores absolutos pequeños.&#x27;
        },
        purchasesAmount: {
          model: &#x27;Random Forest&#x27;, dataset: &#x27;Dataset reducido&#x27;, rmse: 213.0144, mae: 116.9614, mape: 120.74,
          unit: &#x27;MXN reales de mayo de 2026&#x27;, coverage: &#x27;2022-01-29 — 2025-07-30&#x27;, excluded: &#x27;305 días sin cobertura&#x27;,
          periods: [&#x27;02–31 may&#x27;, &#x27;01–30 jun&#x27;, &#x27;01–30 jul&#x27;], modelWindows: [134.1513, 348.0000, 156.8919],
          avg7: { rmse: 297.2899, windows: [141.2977, 368.3630, 382.2090] },
          last: { rmse: 667.2004, windows: [135.4621, 368.3630, 1497.7762] },
          insight: &#x27;Random Forest supera la meta de H1 y es la mejor opción para presupuestar compras. El mayor valor aparece al contener errores extremos de abastecimiento.&#x27;,
          note: &#x27;La serie de compras termina 305 días antes que la de ventas. El tablero debe mostrar esta diferencia de cobertura para evitar decisiones con datos desactualizados.&#x27;
        },
        purchasesRecords: {
          model: &#x27;Random Forest&#x27;, dataset: &#x27;Dataset reducido&#x27;, rmse: 2.5932, mae: 1.7269, mape: 61.14,
          unit: &#x27;registros de compra por día&#x27;, coverage: &#x27;2022-01-29 — 2025-07-30&#x27;, excluded: &#x27;305 días sin cobertura&#x27;,
          periods: [&#x27;02–31 may&#x27;, &#x27;01–30 jun&#x27;, &#x27;01–30 jul&#x27;], modelWindows: [2.2015, 3.3439, 2.2343],
          avg7: { rmse: 3.3579, windows: [2.2438, 3.7059, 4.1240] },
          last: { rmse: 6.0535, windows: [2.1679, 3.7059, 12.2868] },
          insight: &#x27;Random Forest reduce el RMSE por encima de 20% frente al promedio de 7 días y estabiliza especialmente la última ventana de evaluación.&#x27;,
          note: &#x27;La selección se hizo por menor RMSE promedio en tres orígenes. Conviene ampliar la cobertura de compras antes de desplegar el modelo en operación.&#x27;
        }
      };

      const format = (value, digits = 2) =&gt; new Intl.NumberFormat(&#x27;es-MX&#x27;, { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(value);

      function drawChart(item, baselineKey) {
        const baseline = item[baselineKey];
        const width = Math.max(310, Math.floor(svg.getBoundingClientRect().width));
        const height = 250;
        const margin = { top: 28, right: 10, bottom: 46, left: 48 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const maxValue = Math.max(...item.modelWindows, ...baseline.windows) * 1.18;
        const y = value =&gt; margin.top + innerH - (value / maxValue) * innerH;
        const groupW = innerW / item.periods.length;
        const barW = Math.min(28, groupW * .25);
        const lines = [0, .5, 1].map(f =&gt; {
          const value = maxValue * f;
          const py = y(value);
          return `&lt;line class=&quot;cc-gridline&quot; x1=&quot;${margin.left}&quot; x2=&quot;${width - margin.right}&quot; y1=&quot;${py}&quot; y2=&quot;${py}&quot;&gt;&lt;/line&gt;&lt;text x=&quot;${margin.left - 8}&quot; y=&quot;${py + 4}&quot; text-anchor=&quot;end&quot;&gt;${format(value, maxValue &lt; 10 ? 1 : 0)}&lt;/text&gt;`;
        }).join(&#x27;&#x27;);
        const groups = item.periods.map((period, i) =&gt; {
          const center = margin.left + groupW * (i + .5);
          const modelX = center - barW - 2;
          const baseX = center + 2;
          const modelY = y(item.modelWindows[i]);
          const baseY = y(baseline.windows[i]);
          const digits = maxValue &lt; 10 ? 2 : 0;
          return `
            &lt;rect class=&quot;cc-model-bar&quot; x=&quot;${modelX}&quot; y=&quot;${modelY}&quot; width=&quot;${barW}&quot; height=&quot;${margin.top + innerH - modelY}&quot; rx=&quot;3&quot;&gt;&lt;/rect&gt;
            &lt;rect class=&quot;cc-base-bar&quot; x=&quot;${baseX}&quot; y=&quot;${baseY}&quot; width=&quot;${barW}&quot; height=&quot;${margin.top + innerH - baseY}&quot; rx=&quot;3&quot;&gt;&lt;/rect&gt;
            &lt;text class=&quot;cc-value&quot; x=&quot;${modelX + barW / 2}&quot; y=&quot;${Math.max(13, modelY - 6)}&quot; text-anchor=&quot;middle&quot;&gt;${format(item.modelWindows[i], digits)}&lt;/text&gt;
            &lt;text x=&quot;${center}&quot; y=&quot;${height - 18}&quot; text-anchor=&quot;middle&quot;&gt;${period}&lt;/text&gt;`;
        }).join(&#x27;&#x27;);
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.innerHTML = `&lt;title&gt;RMSE del modelo y de la línea base en tres ventanas temporales&lt;/title&gt;&lt;desc&gt;Comparación de menor es mejor para ${objectiveSelect.options[objectiveSelect.selectedIndex].text}.&lt;/desc&gt;${lines}${groups}`;
        root.querySelector(&#x27;#cc-chart-desc&#x27;).textContent = `RMSE promedio: modelo ${format(item.rmse, item.rmse &lt; 10 ? 2 : 0)} frente a línea base ${format(baseline.rmse, baseline.rmse &lt; 10 ? 2 : 0)}.`;
      }

      function update() {
        const item = data[objectiveSelect.value];
        const baselineKey = baselineSelect.value;
        const baseline = item[baselineKey];
        const improvement = 100 * (baseline.rmse - item.rmse) / baseline.rmse;
        const passes = improvement &gt;= 20;
        root.querySelector(&#x27;#cc-model&#x27;).textContent = item.model;
        root.querySelector(&#x27;#cc-dataset&#x27;).textContent = item.dataset;
        root.querySelector(&#x27;#cc-rmse&#x27;).textContent = format(item.rmse, item.rmse &lt; 10 ? 2 : 0);
        root.querySelector(&#x27;#cc-rmse-unit&#x27;).textContent = item.unit;
        root.querySelector(&#x27;#cc-mae&#x27;).textContent = format(item.mae, item.mae &lt; 10 ? 2 : 0);
        root.querySelector(&#x27;#cc-improvement&#x27;).textContent = `${format(improvement, 1)}%`;
        root.querySelector(&#x27;#cc-baseline-rmse&#x27;).textContent = `Base RMSE: ${format(baseline.rmse, baseline.rmse &lt; 10 ? 2 : 0)}`;
        root.querySelector(&#x27;#cc-progress&#x27;).style.width = `${Math.min(100, Math.max(0, improvement / 40 * 100))}%`;
        const status = root.querySelector(&#x27;#cc-status&#x27;);
        status.textContent = passes ? &#x27;Meta superada&#x27; : &#x27;Meta no alcanzada&#x27;;
        status.className = `cc-status ${passes ? &#x27;is-pass&#x27; : &#x27;is-miss&#x27;}`;
        root.querySelector(&#x27;#cc-insight&#x27;).textContent = item.insight;
        root.querySelector(&#x27;#cc-note&#x27;).textContent = item.note;
        root.querySelector(&#x27;#cc-mape&#x27;).textContent = `${format(item.mape, 2)}%`;
        root.querySelector(&#x27;#cc-coverage&#x27;).textContent = item.coverage;
        root.querySelector(&#x27;#cc-excluded&#x27;).textContent = item.excluded;
        drawChart(item, baselineKey);
      }

      objectiveSelect.addEventListener(&#x27;change&#x27;, update);
      baselineSelect.addEventListener(&#x27;change&#x27;, update);
      new ResizeObserver(update).observe(svg);
      update();
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
